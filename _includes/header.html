<header class="site-header">
    <div class="container">
        <div class="header-wrapper">
            <div class="site-branding">
                <a href="{{ '/' | relative_url }}" class="logo-link">
                    <img src="https://wiki.uugrn.org/images/9/9d/Uugrn_vector.svg" alt="UUGRN Logo" class="site-logo">
                </a>
                <div class="site-text">
                    <h1 class="site-title">
                        <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
                    </h1>
                    <p class="site-description">{{ site.description }}</p>
                </div>
            </div>
            <nav class="site-nav">
                <input type="checkbox" id="nav-toggle" class="nav-toggle">
                <label for="nav-toggle" class="nav-toggle-label">
                    <span></span>
                </label>
                <ul class="nav-menu">
                    <li><a href="{{ '/' | relative_url }}">Home</a></li>
                    <li><a href="{{ '/events/' | relative_url }}">Events</a></li>
                    <li><a href="{{ '/community/' | relative_url }}">Community</a></li>
                    <li><a href="{{ '/about/' | relative_url }}">Über uns</a></li>
                </ul>
            </nav>
        </div>
    </div>
</header>
