---
layout: default
---
<div class="container">
    <article class="event">
        <header class="event-header">
            <h1>{{ page.title }}</h1>
            {% if page.date %}
            <p class="event-meta">
                <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%d.%m.%Y" }}</time>
                {% if page.location %} | <span class="location">{{ page.location }}</span>{% endif %}
            </p>
            {% endif %}
        </header>
        <div class="event-content">
            {{ content }}
        </div>
    </article>
</div>
